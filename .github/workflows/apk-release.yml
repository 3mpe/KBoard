# Tek seferlik: CI'ın ürettiği debug APK'yı zip'siz olarak bir pre-release'e koyar.
name: APK release (tek seferlik)
on:
  push:
    branches: [claude/project-thread-m1qxy4]
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KBoard-debug-apk
          run-id: 43526998454
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk
      - name: Pre-release oluştur
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la apk
          cp apk/*.apk KBoard-0.1.0-debug-7fcd45b.apk
          gh release create apk-7fcd45b KBoard-0.1.0-debug-7fcd45b.apk \
            --repo "$GITHUB_REPOSITORY" --target 7fcd45b35af9ee3d9059f243345ee020e9f6a0ce \
            --prerelease --title "KBoard 0.1.0 debug (main 7fcd45b)" \
            --notes "Telefonda denemek için debug APK. Evrensel (arm64-v8a, armeabi-v7a, x86, x86_64). main 7fcd45b."
