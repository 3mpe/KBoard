name: Cihaz sürücüsü (emülatör)

# #9: öneri çubuğunun erişilebilirlik ağacından okunup okunamadığını yoklar (KBoard ve imajdaki
# Gboard) ve KBoard'da cihaz sürücüsünün aynı vakada 3 koşuda aynı izi verip vermediğini sınar.
# Elle ya da sürücü dosyaları değişince çalışır; zorunlu kontrol değildir.
# Elle çalıştırırken `gorev` seçilir: yoklama (yukarıdaki), dogru-cumleler (sürüm öncesi 40 doğru
# cümlede boşlukta değişen kelimeler) ya da surum-duman (geçici anahtarla imzalı release APK'nın
# kurulup yazdığı, önerdiği, aksan düzelttiği ve öğrendiği; release APK'nın izin listesi) ya da
# buyuk-harf (sözlükte yalnız büyük harfli kelimeler: main ile bu dal, önce/sonra) ya da
# taban (ölçüm tabanı: aynı debug APK ile seed-v0'ın sabit alt kümesi iki kez, motor açık ve
# "HeliBoard eşdeğeri (KBoard derlemesi, motor kapalı)"; tek emülatör, .github/ci/taban.sh,
# docs/reports/baseline-v0.md).
on:
  workflow_dispatch:
    inputs:
      gorev:
        description: Koşulacak görev
        type: choice
        options: [yoklama, dogru-cumleler, surum-duman, buyuk-harf, taban]
        default: yoklama
      adet:
        description: dogru-cumleler için cümle sayısı
        type: string
        default: '40'
      taban_grup:
        description: taban için grup başına vaka (aksan, doğru yazım, yazım hatası; 4 = 12 vaka, ~47 dk)
        type: string
        default: '4'
  pull_request:
    paths:
      - eval/kboard_eval/adb_driver.py
      - eval/keymaps/**
      - .github/ci/strip-probe.sh
      - .github/workflows/cihaz-olcum.yml
      - .github/ci/emu-lib.sh

concurrency:
  group: cihaz-olcum-${{ github.ref }}-${{ inputs.gorev || 'yoklama' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    name: ${{ inputs.gorev || 'yoklama' }}${{ matrix.surum != '-' && format(' ({0} {1}/3)', matrix.surum, matrix.parca) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.gorev == 'buyuk-harf' && 180 || (inputs.gorev == 'dogru-cumleler' && 160 || 80) }}
    strategy:
      fail-fast: false
      # buyuk-harf: önce (main) ve sonra (bu dal), her biri üç parça: altı emülatörde paralel
      matrix:
        surum: ${{ inputs.gorev == 'buyuk-harf' && fromJSON('["once","sonra"]') || fromJSON('["-"]') }}
        parca: ${{ inputs.gorev == 'buyuk-harf' && fromJSON('[0,1,2]') || fromJSON('[0]') }}
    env:
      GOREV: ${{ inputs.gorev || 'yoklama' }}
      DOGRU_ADET: ${{ inputs.adet || '40' }}
      TABAN_GRUP: ${{ inputs.taban_grup || '4' }}
      BUYUK_SURUM: ${{ matrix.surum != '-' && matrix.surum || '' }}
      BUYUK_PARCA: ${{ matrix.surum != '-' && format('{0}/3', matrix.parca) || '0/1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.gorev == 'buyuk-harf' && '0' || '1' }}  # '0' dizge: sayı 0 ifadede yanlış sayılır
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Debug APK
        run: ./gradlew assembleDebug
      - name: Önce/sonra APK'ları (buyuk-harf)
        if: env.GOREV == 'buyuk-harf'
        run: |
          set -euo pipefail
          cp "$(ls app/build/outputs/apk/debug/*.apk | head -1)" "$RUNNER_TEMP/kboard-sonra.apk"
          f=app/src/main/java/helium314/keyboard/kboard/KBoardSuggestions.kt
          git show origin/main:$f > $f
          ./gradlew assembleDebug
          cp "$(ls app/build/outputs/apk/debug/*.apk | head -1)" "$RUNNER_TEMP/kboard-once.apk"
          git checkout -- $f
      - name: Release APK (geçici anahtarla imzalı; gerçek sürüm anahtarı burada kullanılmaz)
        if: env.GOREV == 'surum-duman'
        run: |
          set -euo pipefail
          ./gradlew assembleRelease
          bash .github/ci/izin-kontrol.sh "$(ls app/build/outputs/apk/release/*.apk | head -1)"
          bash .github/ci/debug-anahtar-kontrol.sh "$(ls app/build/outputs/apk/release/*.apk | head -1)"
          bt=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          ks="$RUNNER_TEMP/gecici.jks"
          keytool -genkeypair -keystore "$ks" -storepass gecici -keypass gecici -alias gecici \
            -keyalg RSA -keysize 2048 -validity 1 -dname "CN=KBoard gecici" >/dev/null
          "$bt/apksigner" sign --ks "$ks" --ks-pass pass:gecici --ks-key-alias gecici \
            --out "$RUNNER_TEMP/KBoard-release-gecici.apk" "$(ls app/build/outputs/apk/release/*.apk | head -1)"
          "$bt/apksigner" verify "$RUNNER_TEMP/KBoard-release-gecici.apk"
          echo "RELEASE_APK=$RUNNER_TEMP/KBoard-release-gecici.apk" >> "$GITHUB_ENV"
      - name: Disk alanı aç
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/lib/android/sdk/ndk
          rm -rf app/build/intermediates app/build/tmp
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emülatör + yoklama
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 3000M
          cores: 4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/ci/${{ env.GOREV == 'dogru-cumleler' && 'dogru-cumleler' || (env.GOREV == 'surum-duman' && 'release-smoke' || (env.GOREV == 'buyuk-harf' && 'buyuk-harf' || (env.GOREV == 'taban' && 'taban' || 'strip-probe'))) }}.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cihaz-olcum${{ matrix.surum != '-' && format('-{0}-{1}', matrix.surum, matrix.parca) || '' }}
          path: screenshots/

  buyuk-harf-rapor:
    name: buyuk-harf birleşik rapor
    if: always() && inputs.gorev == 'buyuk-harf'
    needs: probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cihaz-olcum-*
          path: parcalar
      - name: Rapor
        run: |
          set -euo pipefail
          for surum in once sonra; do
            f=$(ls parcalar/cihaz-olcum-$surum-*/buyuk-harf/$surum.jsonl 2>/dev/null || true)
            [ -n "$f" ] || { echo "::warning::$surum kaydı yok"; continue; }
            { echo "#### $surum ($(cat $f | wc -l) vaka)"; python3 .github/ci/buyuk-harf.py rapor $f; } | tee -a "$GITHUB_STEP_SUMMARY"
          done
