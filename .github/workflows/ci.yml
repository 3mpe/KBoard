name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  eval:
    name: Ölçüm aracı testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Birim testler
        working-directory: eval
        run: python -W error -m unittest discover -s tests -t . -v
      - name: Test setini doğrula
        working-directory: eval
        run: python -m kboard_eval validate testset/*.jsonl

  engine-eval:
    name: Motor ölçüm eşiği
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Motor + aksan dizini + ek zinciri modeli
        run: ./gradlew :engine:installDist :engine:buildDeasciifyIndex :engine:buildNgramModel :engine:buildSuffixModel
      - name: 327 vakalık sette ölçüm
        working-directory: eval
        run: |
          mkdir -p out
          python -m kboard_eval simulate testset/seed-v0.jsonl -o out/engine.jsonl --predictor subprocess \
            --command "../engine/build/install/engine/bin/engine --deasciify ../engine/build/kboard/deasciify-tr.kbd --ngram ../engine/build/kboard/kboard-tr.kbn --denylist ../data/ngram-denylist.txt --suffix ../engine/build/kboard/suffix-tr.kbs"
          python -m kboard_eval score testset/seed-v0.jsonl -t out/engine.jsonl --json out/engine.json --markdown out/engine.md
          cat out/engine.md >> "$GITHUB_STEP_SUMMARY"
      - name: Eşikler
        run: python .github/ci/eval-gate.py eval/out/engine.json
      - name: Ek zinciri olay karşılaştırması (uyarı, CI'ı kırmaz)
        working-directory: eval
        run: |
          python -m kboard_eval simulate testset/seed-v0.jsonl -o out/engine-ek-yok.jsonl --predictor subprocess \
            --command "../engine/build/install/engine/bin/engine --deasciify ../engine/build/kboard/deasciify-tr.kbd --ngram ../engine/build/kboard/kboard-tr.kbn --denylist ../data/ngram-denylist.txt"
          python ../.github/ci/suffix-events.py testset/seed-v0.jsonl out/engine-ek-yok.jsonl out/engine.jsonl | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Yazım kuralları (kural-v0; tuzakta 0 düzeltme, kesinlik ve duyarlılık eşikleri)
        working-directory: eval
        run: |
          set -o pipefail
          python -m kboard_eval simulate testset/kural-v0.jsonl -o out/kural.jsonl --predictor subprocess \
            --command "../engine/build/install/engine/bin/engine --deasciify ../engine/build/kboard/deasciify-tr.kbd --ngram ../engine/build/kboard/kboard-tr.kbn --denylist ../data/ngram-denylist.txt --suffix ../engine/build/kboard/suffix-tr.kbs"
          python -m kboard_eval score testset/kural-v0.jsonl -t out/kural.jsonl --json out/kural.json --markdown out/kural.md --title "kural-v0 (yazım kuralları)"
          cat out/kural.md >> "$GITHUB_STEP_SUMMARY"
          python ../.github/ci/kural-gate.py out/kural.json --trace out/kural.jsonl --testset testset/kural-v0.jsonl | tee -a "$GITHUB_STEP_SUMMARY"
      - name: de/da/ki ayrımı (dedaki-v0 test yarısı; ilk 3 ve ilk yuva, tuzaklar, yalnız öneri)
        working-directory: eval
        run: |
          set -o pipefail
          python -m kboard_eval simulate testset/dedaki-v0.jsonl -o out/dedaki.jsonl --predictor subprocess \
            --command "../engine/build/install/engine/bin/engine --deasciify ../engine/build/kboard/deasciify-tr.kbd --ngram ../engine/build/kboard/kboard-tr.kbn --denylist ../data/ngram-denylist.txt --suffix ../engine/build/kboard/suffix-tr.kbs"
          python ../.github/ci/dedaki-gate.py out/dedaki.jsonl testset/dedaki-v0.jsonl --split test --json out/dedaki.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Korpusta ayrık bağlaç önerisi (doğru yazılmış -de/-da/-ki; ilk yuvada en çok %5)
        run: |
          set -o pipefail
          python data/tools/corpus_split.py --engine engine/build/install/engine/bin/engine \
            --deasciify engine/build/kboard/deasciify-tr.kbd --args "--suffix engine/build/kboard/suffix-tr.kbs" \
            --gate 0.05 --json eval/out/corpus-split.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Korpusta yanlış oto. düzeltme (her 10. satır ayrılır, dil modeli onsuz derlenir)
        run: |
          python data/tools/corpus_false_ac.py --engine engine/build/install/engine/bin/engine \
            --deasciify engine/build/kboard/deasciify-tr.kbd \
            --run "varsayilan=--suffix engine/build/kboard/suffix-tr.kbs" \
            --run "kuralsiz=--no-rules --suffix engine/build/kboard/suffix-tr.kbs" \
            --run "typo-otomatik=--typo-autocorrect --suffix engine/build/kboard/suffix-tr.kbs" --context \
            --gate varsayilan=0.003 --gate varsayilan+ctx=0.003 \
            --compare varsayilan:kuralsiz=0.0001 --compare varsayilan+ctx:kuralsiz+ctx=0.0001 \
            --json eval/out/corpus-false-ac.json
      - name: Kişisel öğrenme ölçümü (kisisel-v0 test kullanıcıları + seed-v0, öğrenme açık/kapalı)
        working-directory: eval
        run: |
          engine="../engine/build/install/engine/bin/engine --deasciify ../engine/build/kboard/deasciify-tr.kbd --ngram ../engine/build/kboard/kboard-tr.kbn --denylist ../data/ngram-denylist.txt --suffix ../engine/build/kboard/suffix-tr.kbs --personal"
          python -m kboard_eval simulate testset/kisisel-v0.jsonl -o out/kisisel-kapali.jsonl --predictor subprocess --command "$engine"
          python -m kboard_eval simulate testset/kisisel-v0.jsonl -o out/kisisel-acik.jsonl --online --predictor subprocess --command "$engine"
          python -m kboard_eval simulate testset/seed-v0.jsonl -o out/seed-acik.jsonl --online --predictor subprocess --command "$engine"
          python -m kboard_eval score testset/kisisel-v0.jsonl -t out/kisisel-kapali.jsonl --split test --json out/kisisel-kapali.json --markdown out/kisisel-kapali.md --title "kisisel-v0 test, öğrenme kapalı"
          python -m kboard_eval score testset/kisisel-v0.jsonl -t out/kisisel-acik.jsonl --split test --json out/kisisel-acik.json --markdown out/kisisel-acik.md --title "kisisel-v0 test, öğrenme açık"
          python -m kboard_eval score testset/seed-v0.jsonl -t out/seed-acik.jsonl --json out/seed-acik.json --markdown out/seed-acik.md --title "seed-v0, öğrenme açık"
          cat out/kisisel-kapali.md out/kisisel-acik.md out/seed-acik.md >> "$GITHUB_STEP_SUMMARY"
      - name: Kişisel öğrenme eşikleri
        run: python .github/ci/personal-gate.py --personal eval/out/kisisel-kapali.json eval/out/kisisel-acik.json --seed eval/out/engine.json eval/out/seed-acik.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-eval
          path: |
            eval/out/engine.*
            eval/out/corpus-false-ac.json
            eval/out/kural.*
            eval/out/dedaki.*
            eval/out/corpus-split.json
            eval/out/kisisel-*
            eval/out/seed-acik.*

  android:
    name: Debug APK + izin kontrolü
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21' # Robolectric, SDK 35+ için Java 21 istiyor
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Debug APK
        run: ./gradlew assembleDebug
      - name: İzin listesi (ağ izni olmamalı)
        run: bash .github/ci/izin-kontrol.sh "$(ls app/build/outputs/apk/debug/*.apk | head -1)"
      - name: Öneri motoru testleri
        run: ./gradlew :engine:test
      - name: KBoard uygulama testleri (Robolectric, yalnız kboard paketi)
        # Upstream paketin tamamı #30 yüzünden askıda kalıyor; KBoard'un kendi testleri burada zorunlu.
        timeout-minutes: 15
        run: ./gradlew --init-script .github/ci/test-logging.init.gradle testRunTestsUnitTest --tests 'helium314.keyboard.kboard.*'
      - name: Aksan dizini, dil modeli ve ek zinciri modeli APK'da mı
        run: |
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          unzip -l "$apk" | grep -E 'assets/kboard/deasciify-tr\.kbd' || { echo "::error::assets/kboard/deasciify-tr.kbd APK'da yok"; exit 1; }
          unzip -l "$apk" | grep -E 'assets/kboard/kboard-tr\.kbn' || { echo "::error::assets/kboard/kboard-tr.kbn APK'da yok"; exit 1; }
          unzip -l "$apk" | grep -E 'assets/kboard/denylist-tr\.txt' || { echo "::error::assets/kboard/denylist-tr.txt APK'da yok"; exit 1; }
          unzip -l "$apk" | grep -E 'assets/kboard/suffix-tr\.kbs' || { echo "::error::assets/kboard/suffix-tr.kbs APK'da yok"; exit 1; }
          # Dil modeli boyut bütçesi: <= 1,1 MB (biçim 3; sohbet korpusuyla 1,08 MB)
          size=$(stat -c %s engine/build/kboard/kboard-tr.kbn)
          echo "kboard-tr.kbn: $size bayt"
          [ "$size" -le 1100000 ] || { echo "::error::kboard-tr.kbn $size bayt, bütçe 1 100 000"; exit 1; }
          # Ek zinciri modeli boyut bütçesi: <= 100 KB (faz-ek-zinciri.md)
          size=$(stat -c %s engine/build/kboard/suffix-tr.kbs)
          echo "suffix-tr.kbs: $size bayt"
          [ "$size" -le 102400 ] || { echo "::error::suffix-tr.kbs $size bayt, bütçe 102 400"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KBoard-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  upstream-tests:
    # HeliBoard'un kendi birim test paketi (KBoard testleri dahil, tek JVM). #30'daki askı PR #49'da
    # giderildi; continue-on-error yok, hiçbir test atlanmıyor. Dal korumasında zorunlu kontrol olacak.
    name: Upstream birim testleri
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21' # Robolectric, SDK 35+ için Java 21 istiyor
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Birim testler (runTests varyantı)
        run: ./gradlew --init-script .github/ci/test-logging.init.gradle testRunTestsUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-test-reports
          path: app/build/reports/tests
