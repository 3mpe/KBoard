name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Ölçüm aracı testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Birim testler
        working-directory: eval
        run: python -W error -m unittest discover -s tests -t . -v
      - name: Test setini doğrula
        working-directory: eval
        run: python -m kboard_eval validate testset/*.jsonl

  android:
    name: Debug APK + birim testler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Debug APK
        run: ./gradlew assembleDebug
      - name: İnternet izni olmamalı
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          perms=$("$aapt2" dump permissions "$apk")
          echo "$perms"
          if echo "$perms" | grep -E "android.permission.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE)"; then
            echo "::error::APK ağ izni içeriyor. KBoard tamamen çevrimdışı olmalı."
            exit 1
          fi
      - name: Birim testler
        run: ./gradlew testRunTestsUnitTest :engine:test
      - uses: actions/upload-artifact@v4
        with:
          name: KBoard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: '*/build/reports'
