name: Önizleme APK

# Telefonda denemek için: bir CI koşusunun debug APK'sını zip'siz olarak bir ön sürüme (pre-release)
# koyar, böylece doğrudan indirme bağlantısı olur. İmzalı sürüm değildir (bkz. release.yml); her CI
# koşusu ayrı debug anahtarıyla imzalar, bu yüzden önceki önizlemenin üstüne kurulmaz.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: KBoard-debug-apk üreten ci.yml koşusunun kimliği
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  onizleme:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: KBoard-debug-apk
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: apk
      - name: Ön sürüm
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::run_id sayı olmalı"; exit 1; }
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)
          short=${sha:0:7}
          f="KBoard-debug-$short.apk"
          cp "$(ls apk/*.apk | head -1)" "$f"
          # Etiket varsayılan dalın ucuna konur: GITHUB_TOKEN, iş akışı dosyası değiştiren bir PR
          # commit'ine etiket açamıyor (403). APK'nın kaynağı dosya adında ve notta yazılı.
          gh release create "apk-$short" "$f" --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "KBoard debug önizleme ($short)" \
            --notes "Telefonda denemek için debug APK (imzalı sürüm değil). APK'nın kaynağı: $sha (etiket main'e işaret eder). Önceki önizlemenin üstüne kurulmaz: önce Ayarlar → Yedekle ile dışa aktar, eskisini kaldır, sonra kur."
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/apk-$short/$f" >> "$GITHUB_STEP_SUMMARY"
